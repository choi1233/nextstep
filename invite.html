<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>NEXT STEP! — 초대장</title>
  <link rel="icon" href="CVCD.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @font-face { font-family:'Pretendard'; src:url('font/Pretendard-SemiBold.ttf') format('truetype'); font-weight:600; }
    @font-face { font-family:'Pretendard'; src:url('font/Pretendard-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'HelveticaC'; src:url('font/helvetica-compressed-5871d14b6903a.otf') format('opentype'); font-weight:400; }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }

    html, body {
      min-height: 100%;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    .ticket-wrap {
      width: 100%;
      max-width: 360px;
      animation: slideUp 0.7s cubic-bezier(0.34,1.4,0.64,1) both;
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(48px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* ── TICKET CARD ── */
    .ticket {
      background: #00ACEB;
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 2px 0 rgba(0,0,0,0.08) inset,
        0 32px 80px rgba(0,0,0,0.32),
        0 8px 24px rgba(0,0,0,0.18);
      color: #000;
      position: relative;
    }

    /* ── HEADER ── */
    .tk-header {
      padding: 22px 24px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .brand {
      font-family: 'HelveticaC', 'Helvetica Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 0.01em;
      color: #000;
      line-height: 1;
    }
    .brand em { color: #000; font-style: normal; }
    .class-tag {
      font-size: 9px;
      letter-spacing: 0.14em;
      color: rgba(0,0,0,0.4);
      margin-top: 5px;
      text-transform: uppercase;
    }
    .seat-wrap { text-align: right; }
    .seat-label { font-size: 9px; color: rgba(0,0,0,0.4); letter-spacing: 0.1em; margin-bottom: 2px; }
    .seat-num {
      font-family: 'HelveticaC', sans-serif;
      font-size: 32px;
      color: #000;
      line-height: 1;
    }

    /* ── ROUTE ── */
    .tk-route {
      padding: 22px 24px 10px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .city-sub { font-size: 10px; color: rgba(0,0,0,0.4); margin-bottom: 2px; letter-spacing: 0.06em; }
    .city-code {
      font-family: 'HelveticaC', sans-serif;
      font-size: 62px;
      line-height: 1;
      letter-spacing: -0.01em;
      color: #000;
    }
    .city-name { font-size: 10px; color: rgba(0,0,0,0.5); margin-top: 3px; }
    .route-mid {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 8px 10px;
    }
    .route-line {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(0,0,0,0.2), transparent);
    }
    .plane-svg { color: #000; }
    .city-right { text-align: right; }

    /* ── DETAILS ── */
    .tk-details {
      padding: 16px 24px 18px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .dt-col:last-child { text-align: right; }
    .dt-label { font-size: 9px; color: rgba(0,0,0,0.4); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
    .dt-val { font-size: 13px; color: #000; font-weight: 600; letter-spacing: 0.02em; }

    /* ── PERFORATED DIVIDER ── */
    .perforation {
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 14px;
      height: 28px;
    }
    .perforation::before,
    .perforation::after {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px; height: 28px;
      background: #e8e8e8;
      border-radius: 50%;
      z-index: 2;
    }
    .perforation::before { left: -14px; }
    .perforation::after  { right: -14px; }
    .perf-line {
      flex: 1;
      border-top: 1.5px dashed rgba(0,0,0,0.15);
    }

    /* ── PASSENGER ── */
    .tk-passenger {
      padding: 16px 24px 18px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .ps-col:last-child { text-align: right; }
    .ps-label { font-size: 9px; color: rgba(0,0,0,0.4); letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 4px; }
    .ps-val { font-size: 14px; color: #000; font-weight: 600; letter-spacing: 0.02em; }

    /* ── QR ── */
    .tk-qr {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .qr-box {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      display: inline-flex;
    }
    #qrcode canvas, #qrcode img { display:block; border-radius:4px; }
    .tk-footer {
      text-align: center;
      font-size: 10px;
      color: rgba(0,0,0,0.4);
      line-height: 1.8;
      letter-spacing: 0.04em;
    }
    .tk-footer strong {
      display: block;
      color: rgba(0,0,0,0.7);
      font-size: 11px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

<div class="ticket-wrap">
  <div class="ticket">

    <!-- HEADER -->
    <div class="tk-header">
      <div>
        <div class="brand">NEXT <em>STEP!</em></div>
        <div class="class-tag">INVITATION</div>
      </div>
      <div class="seat-wrap">
        <div class="seat-label">좌석</div>
        <div class="seat-num">1A</div>
      </div>
    </div>

    <!-- ROUTE -->
    <div class="tk-route">
      <div>
        <div class="city-sub">출발</div>
        <div class="city-code">CSU</div>
        <div class="city-name">조선대학교</div>
      </div>
      <div class="route-mid">
        <svg class="plane-svg" width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
        </svg>
        <div class="route-line"></div>
      </div>
      <div class="city-right">
        <div class="city-sub">도착</div>
        <div class="city-code">NST</div>
        <div class="city-name">NEXT STEP!</div>
      </div>
    </div>

    <!-- DETAILS -->
    <div class="tk-details">
      <div class="dt-col">
        <div class="dt-label">편명</div>
        <div class="dt-val">NS-76</div>
      </div>
      <div class="dt-col">
        <div class="dt-label">날짜</div>
        <div class="dt-val">09.16</div>
      </div>
      <div class="dt-col">
        <div class="dt-label">시간</div>
        <div class="dt-val">10:00</div>
      </div>
      <div class="dt-col">
        <div class="dt-label">탑승</div>
        <div class="dt-val">09:30</div>
      </div>
      <div class="dt-col">
        <div class="dt-label">SEQ</div>
        <div class="dt-val">76</div>
      </div>
    </div>

    <!-- PERFORATED -->
    <div class="perforation"><div class="perf-line"></div></div>

    <!-- PASSENGER -->
    <div class="tk-passenger">
      <div class="ps-col">
        <div class="ps-label">이름</div>
        <div class="ps-val" id="passenger-name">GUEST</div>
      </div>
      <div class="ps-col">
        <div class="ps-label">터미널</div>
        <div class="ps-val">3F</div>
      </div>
      <div class="ps-col">
        <div class="ps-label">게이트</div>
        <div class="ps-val">GATE 1</div>
      </div>
    </div>

    <!-- QR -->
    <div class="tk-qr">
      <div class="qr-box">
        <div id="qrcode"></div>
      </div>
      <div class="tk-footer">
        <strong>제76회 조선대학교 미술대학</strong>
        시각디자인학과 졸업전시<br>
        2026. 09. 16 (SUN) — 09. 22 (SAT)<br>
        광주 동구 조선대길 108 · 미술대학 3F
      </div>
    </div>

  </div>
</div>

<script>
  /* URL ?name=홍길동 → 이름 표시 */
  var params = new URLSearchParams(window.location.search);
  var name = params.get('name');
  if (name) document.getElementById('passenger-name').textContent = name.toUpperCase();

  /* QR 코드 — 아래 URL을 실제 전시 사이트 주소로 교체하세요 */
  var QR_URL = 'http://cvcd2026.kro.kr/';
  new QRCode(document.getElementById('qrcode'), {
    text: QR_URL,
    width: 200,
    height: 200,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
</script>
</body>
</html>

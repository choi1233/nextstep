<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>NEXT STEP! — 초대장</title>
  <meta property="og:title" content="NEXT STEP! — 초대장">
  <meta property="og:description" content="제 76회 조선대학교 미술대학 시각디자인학과 졸업전시 · 2026. 09. 16 - 09. 22">
  <meta property="og:image" content="http://cvcd2026.kro.kr/thumbnail.png">
  <meta property="og:url" content="http://cvcd2026.kro.kr/invite.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="http://cvcd2026.kro.kr/thumbnail.png">
  <link rel="icon" href="CVCD.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @font-face { font-family:'Pretendard'; src:url('font/Pretendard-SemiBold.ttf') format('truetype'); font-weight:600; }
    @font-face { font-family:'Pretendard'; src:url('font/Pretendard-Regular.ttf') format('truetype'); font-weight:400; }
    @font-face { font-family:'HelveticaC'; src:url('font/helvetica-compressed-5871d14b6903a.otf') format('opentype'); font-weight:400; }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }

    html, body {
      min-height: 100%;
      background: #c8c8c8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      font-family: 'Pretendard', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    .ticket-wrap {
      width: 100%;
      max-width: 360px;
      animation: slideUp 0.7s cubic-bezier(0.34,1.4,0.64,1) both;
      filter:
        drop-shadow(0 32px 80px rgba(0,0,0,0.32))
        drop-shadow(0 8px 24px rgba(0,0,0,0.18));
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(48px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    /* ── TICKET CARD ── */
    .ticket {
      position: relative;
      color: #000;
    }

    .ticket-svg {
      position: absolute;
      top: 0; left: 0;
      z-index: 0;
      pointer-events: none;
    }

    .ticket-body {
      position: relative;
      z-index: 1;
    }

    /* ── HEADER ── */
    .tk-header {
      padding: 22px 16px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .brand {
      font-family: 'HelveticaC', 'Helvetica Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 0.01em;
      color: #000;
      line-height: 1;
    }
    .class-tag {
      font-family: 'Pretendard', sans-serif;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: rgba(0,0,0,0.5);
      margin-top: 4px;
      text-transform: uppercase;
    }
    .hd-info {
      text-align: right;
      font-family: 'Pretendard', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: #000;
      line-height: 1.6;
    }

    /* ── ROUTE ── */
    .tk-route {
      padding: 20px 16px 16px;
    }
    .route-labels {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .route-label {
      font-family: 'Pretendard', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: rgba(0,0,0,0.5);
      letter-spacing: 0.04em;
    }
    .route-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .city-code {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 300;
      font-size: clamp(44px, 16vw, 72px);
      line-height: 1;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .plane-icon {
      flex: 0 0 auto;
      color: #000;
      padding: 0 4px;
      transform: rotate(90deg);
    }

    /* ── NOTCH MARKER (측정용, 보이지 않음) ── */
    .notch-marker { height: 0; }

    /* ── DETAILS ── */
    .tk-details {
      padding: 14px 16px 14px;
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
    }
    .dt-col:last-child { text-align: right; }
    .dt-label {
      font-family: 'Pretendard', sans-serif;
      font-size: 10px;
      font-weight: 400;
      color: rgba(0,0,0,0.5);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .dt-val {
      font-family: 'Pretendard', sans-serif;
      font-size: 15px;
      color: #000;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    /* ── PASSENGER ── */
    .tk-passenger {
      padding: 14px 16px 16px;
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
    }
    .ps-col:last-child { text-align: right; }
    .ps-label {
      font-family: 'Pretendard', sans-serif;
      font-size: 10px;
      font-weight: 400;
      color: rgba(0,0,0,0.5);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .ps-val {
      font-family: 'Pretendard', sans-serif;
      font-size: 15px;
      color: #000;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }

    /* ── QR ── */
    .tk-qr {
      padding: 75px 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .qr-label {
      font-family: 'Pretendard', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: rgba(0,0,0,0.5);
      text-transform: uppercase;
      text-align: center;
    }
    .qr-box {
      background: #fff;
      border-radius: 5px;
      padding: 6px;
      display: inline-flex;
    }
    #qrcode canvas, #qrcode img { display:block; }

    /* ── FOOTER ── */
    .tk-footer {
      padding: 16px 16px 22px;
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      align-items: center;
    }
    .tk-footer-logo img {
      width: 28px;
      height: auto;
      display: block;
    }
    .tk-footer-text {
      font-family: 'Pretendard', sans-serif;
      font-size: 10px;
      font-weight: 400;
      color: rgba(0,0,0,0.55);
      line-height: 1.7;
      letter-spacing: 0.01em;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="ticket-wrap">
  <div class="ticket">

    <!-- SVG 배경 (JS로 path 업데이트) -->
    <svg class="ticket-svg" xmlns="http://www.w3.org/2000/svg">
      <path id="ticket-path" fill="#00ACEB"></path>
    </svg>

    <!-- 콘텐츠 -->
    <div class="ticket-body">

      <!-- HEADER -->
      <div class="tk-header">
        <div>
          <div class="brand">NEXT STEP!</div>
          <div class="class-tag">INVITATION</div>
        </div>
        <div class="hd-info">
          제 76회 조선대학교 미술대학<br>
          시각디자인학과 졸업전시
        </div>
      </div>

      <!-- ROUTE -->
      <div class="tk-route">
        <div class="route-labels">
          <span class="route-label">출발</span>
          <span class="route-label">도착</span>
        </div>
        <div class="route-main">
          <div class="city-code">CSU</div>
          <div class="plane-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor">
              <path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/>
            </svg>
          </div>
          <div class="city-code">NST</div>
        </div>
      </div>

      <!-- NOTCH MARKER 1 (route ↔ details) -->
      <div class="notch-marker" id="notch1"></div>

      <!-- DETAILS -->
      <div class="tk-details">
        <div class="dt-col">
          <div class="dt-label">편명</div>
          <div class="dt-val">2NS76</div>
        </div>
        <div class="dt-col">
          <div class="dt-label">날짜</div>
          <div class="dt-val">09.16 - 09.22</div>
        </div>
        <div class="dt-col">
          <div class="dt-label">시간</div>
          <div class="dt-val">10:00 -</div>
        </div>
      </div>

      <!-- NOTCH MARKER 2 (details ↔ passenger, 오른쪽만) -->
      <div class="notch-marker" id="notch2"></div>

      <!-- PASSENGER -->
      <div class="tk-passenger">
        <div class="ps-col">
          <div class="ps-label">이름</div>
          <div class="ps-val" id="passenger-name">GUEST</div>
        </div>
        <div class="ps-col">
          <div class="ps-label">터미널</div>
          <div class="ps-val">조선대학교<br>미술대학 3F (미술관)</div>
        </div>
        <div class="ps-col">
          <div class="ps-label">탑승구</div>
          <div class="ps-val">GATE 1</div>
        </div>
      </div>

      <!-- QR -->
      <div class="tk-qr">
        <div class="qr-label">NEXT STEP! WEBSITE</div>
        <a href="http://cvcd2026.kro.kr/" target="_blank" class="qr-box" style="text-decoration:none;">
          <div id="qrcode"></div>
        </a>
      </div>

      <!-- FOOTER -->
      <div class="tk-footer">
        <div class="tk-footer-logo">
          <img src="CVCD2.png" alt="CVCD">
        </div>
        <div class="tk-footer-text">
          2026. 09. 16 (Wed) - 09. 22 (Tue)<br>
          광주전남 동구 조선대길 106 미술대학 3F
        </div>
        <div></div>
      </div>

    </div><!-- /ticket-body -->
  </div><!-- /ticket -->
</div><!-- /ticket-wrap -->

<script>
  /* ── URL ?name= ── */
  var params = new URLSearchParams(window.location.search);
  var name = params.get('name');
  if (name) document.getElementById('passenger-name').textContent = name.toUpperCase();

  /* ── QR ── */
  var QR_URL = 'http://cvcd2026.kro.kr/';
  var cardInnerW = document.querySelector('.ticket-body').offsetWidth - 32;
  var qrSize = Math.round(cardInnerW * 0.35);
  new QRCode(document.getElementById('qrcode'), {
    text: QR_URL,
    width: qrSize,
    height: qrSize,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  /* ── SVG 티켓 배경 ── */
  function drawTicket() {
    var body   = document.querySelector('.ticket-body');
    var W      = body.offsetWidth;
    var H      = body.offsetHeight;
    var R      = 22;   /* 모서리 반지름 */
    var r      = 9;    /* 노치 반지름 */

    /* 노치 Y 위치 (ticket-body 기준) */
    var n1el = document.getElementById('notch1');
    var n2el = document.getElementById('notch2');
    var y1 = n1el.offsetTop;
    var y2 = n2el.offsetTop;

    /* SVG 크기 설정 */
    var svg = document.querySelector('.ticket-svg');
    svg.setAttribute('width',   W);
    svg.setAttribute('height',  H);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    /* 오른쪽: 노치 2개(y1, y2) / 왼쪽: 노치 1개(y1) */
    var d = [
      'M', R, 0,
      'H', W - R, 'Q', W, 0, W, R,
      'V', y1 - r,
      'A', r, r, 0, 0, 0, W, y1 + r,
      'V', y2 - r,
      'A', r, r, 0, 0, 0, W, y2 + r,
      'V', H - R, 'Q', W, H, W - R, H,
      'H', R, 'Q', 0, H, 0, H - R,
      'V', y1 + r,
      'A', r, r, 0, 0, 0, 0, y1 - r,
      'V', R, 'Q', 0, 0, R, 0, 'Z'
    ].join(' ');

    document.getElementById('ticket-path').setAttribute('d', d);
  }

  /* QR 생성 후 그리기 (약간 딜레이) */
  setTimeout(drawTicket, 100);
  window.addEventListener('resize', drawTicket);
</script>
</body>
</html>

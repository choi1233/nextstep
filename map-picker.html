<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Map Position Picker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', sans-serif; background: #111; color: #fff; }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #222; padding: 12px 16px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  #toolbar h1 { font-size: 14px; font-weight: 600; color: #fff; }
  #current-num { font-size: 22px; font-weight: 700; color: #00ACEB; min-width: 40px; text-align: center; }

  .btn {
    padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 600;
  }
  .btn-blue { background: #00ACEB; color: #fff; }
  .btn-red { background: #e74c3c; color: #fff; }
  .btn-green { background: #2ecc71; color: #000; }
  .btn-gray { background: #555; color: #fff; }

  #status { font-size: 13px; color: #aaa; }

  #map-wrap {
    margin-top: 56px;
    position: relative;
    display: inline-block;
    cursor: crosshair;
  }
  #map-img { display: block; max-width: 100%; }

  .dot {
    position: absolute;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(0, 172, 235, 0.85);
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  #output-panel {
    position: fixed; right: 0; top: 56px; bottom: 0;
    width: 320px; background: #1a1a1a; border-left: 1px solid #333;
    overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #output-panel h2 { font-size: 13px; color: #aaa; }
  #output-code {
    font-family: monospace; font-size: 11px; color: #7ec8e3;
    background: #111; padding: 12px; border-radius: 6px;
    white-space: pre-wrap; word-break: break-all;
    flex: 1; overflow-y: auto;
  }

  #log {
    font-size: 11px; color: #888; max-height: 200px; overflow-y: auto;
  }
  #log div { padding: 2px 0; border-bottom: 1px solid #222; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>🗺 Map Picker</h1>
  <span>현재 번호:</span>
  <span id="current-num">1</span>
  <button class="btn btn-blue" onclick="prevNum()">◀ 이전</button>
  <button class="btn btn-blue" onclick="nextNum()">다음 ▶</button>
  <button class="btn btn-red" onclick="undoLast()">↩ 실행취소</button>
  <button class="btn btn-gray" onclick="clearAll()">전체 초기화</button>
  <button class="btn btn-green" onclick="copyCode()">📋 코드 복사</button>
  <span id="status">지도를 클릭해서 위치 지정</span>
</div>

<div id="map-wrap">
  <img id="map-img" src="main/s4/map.png" alt="map" draggable="false">
</div>

<div id="output-panel">
  <h2>생성된 좌표 코드</h2>
  <div id="output-code">// 아직 위치가 지정되지 않았습니다</div>
  <h2>로그</h2>
  <div id="log"></div>
</div>

<script>
var positions = {}; // { 1: {x: 0.32, y: 0.45}, ... }
var currentNum = 1;
var MAX_NUM = 44;

var mapImg = document.getElementById('map-img');
var mapWrap = document.getElementById('map-wrap');
var currentNumEl = document.getElementById('current-num');
var statusEl = document.getElementById('status');
var outputCode = document.getElementById('output-code');
var logEl = document.getElementById('log');

// Load saved from localStorage
try {
  var saved = localStorage.getItem('mapPositions');
  if (saved) {
    positions = JSON.parse(saved);
    log('💾 저장된 위치 ' + Object.keys(positions).length + '개 불러옴');
  }
} catch(e) {}

function save() {
  try { localStorage.setItem('mapPositions', JSON.stringify(positions)); } catch(e) {}
  updateOutput();
  renderDots();
}

mapWrap.addEventListener('click', function(e) {
  var rect = mapImg.getBoundingClientRect();
  var x = (e.clientX - rect.left) / rect.width;
  var y = (e.clientY - rect.top) / rect.height;
  x = Math.round(x * 10000) / 10000;
  y = Math.round(y * 10000) / 10000;

  positions[currentNum] = { x: x, y: y };
  log('✅ #' + currentNum + ' → (' + (x*100).toFixed(1) + '%, ' + (y*100).toFixed(1) + '%)');
  save();

  // Auto advance
  if (currentNum < MAX_NUM) {
    currentNum++;
    currentNumEl.textContent = currentNum;
    updateStatus();
  } else {
    statusEl.textContent = '모든 번호 지정 완료! 코드를 복사하세요.';
  }
});

function prevNum() {
  if (currentNum > 1) { currentNum--; currentNumEl.textContent = currentNum; updateStatus(); }
}
function nextNum() {
  if (currentNum < MAX_NUM) { currentNum++; currentNumEl.textContent = currentNum; updateStatus(); }
}
function undoLast() {
  // find the highest number that has a position and remove it
  for (var i = MAX_NUM; i >= 1; i--) {
    if (positions[i]) {
      log('↩ #' + i + ' 취소');
      delete positions[i];
      currentNum = i;
      currentNumEl.textContent = currentNum;
      save();
      updateStatus();
      return;
    }
  }
}
function clearAll() {
  if (!confirm('모든 위치를 초기화할까요?')) return;
  positions = {};
  currentNum = 1;
  currentNumEl.textContent = currentNum;
  save();
  log('🗑 전체 초기화');
}
function updateStatus() {
  var done = Object.keys(positions).length;
  statusEl.textContent = done + '/' + MAX_NUM + ' 지정됨 | 현재: #' + currentNum + (positions[currentNum] ? ' (재지정)' : '');
}

function renderDots() {
  // Remove old dots
  var old = mapWrap.querySelectorAll('.dot');
  old.forEach(function(d) { d.remove(); });

  var rect = mapImg.getBoundingClientRect();
  var iw = mapImg.offsetWidth;
  var ih = mapImg.offsetHeight;

  Object.keys(positions).forEach(function(num) {
    var p = positions[num];
    var dot = document.createElement('div');
    dot.className = 'dot';
    dot.textContent = num;
    dot.style.left = (p.x * 100) + '%';
    dot.style.top = (p.y * 100) + '%';
    mapWrap.appendChild(dot);
  });
}

function updateOutput() {
  var keys = Object.keys(positions).map(Number).sort(function(a,b){return a-b;});
  if (keys.length === 0) {
    outputCode.textContent = '// 아직 위치가 지정되지 않았습니다';
    return;
  }
  var lines = ['var MAP_POSITIONS = {'];
  keys.forEach(function(k) {
    var p = positions[k];
    lines.push('  ' + k + ': { x: ' + p.x + ', y: ' + p.y + ' },');
  });
  lines.push('};');
  outputCode.textContent = lines.join('\n');
  updateStatus();
}

function copyCode() {
  var text = outputCode.textContent;
  navigator.clipboard.writeText(text).then(function() {
    statusEl.textContent = '✅ 복사됨!';
    setTimeout(updateStatus, 2000);
  });
}

function log(msg) {
  var d = document.createElement('div');
  d.textContent = msg;
  logEl.insertBefore(d, logEl.firstChild);
}

// Rerender dots when image loads / resizes
mapImg.addEventListener('load', function() { renderDots(); updateOutput(); });
window.addEventListener('resize', renderDots);

// Initial render
if (mapImg.complete) { renderDots(); updateOutput(); }
updateStatus();
</script>
</body>
</html>
